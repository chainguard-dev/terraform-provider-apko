version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns:
          - "github.com/hashicorp/*"
    # The deps agent moves it together with APKO_IMAGE (.chainguard/deps.yaml).
    ignore:
      - dependency-name: "chainguard.dev/apko"
    cooldown:
      default-days: 7
      exclude:
        - "golang.org/x/*"
