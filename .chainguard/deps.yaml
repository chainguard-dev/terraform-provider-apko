# The Chainguard deps agent opens one pull request per entry, on
# chainguard/deps/<name>, that updates the entry's dependencies and fixes
# what the updates break. Schedules are UTC. The paths and prompt guide the
# agent; they are not enforced.
#
# Dependabot ignores chainguard.dev/apko (.github/dependabot.yml) so that only
# this entry moves it.
version: 1
updates:
  - name: apko
    schedule: "0 1 * * *" # daily
    paths: ["go.mod", "go.sum", ".chainguard/ci/mega-module.yaml"]
    environment: .chainguard/ci/mega-module.yaml
    prompt: >-
      Keep the chainguard.dev/apko Go module and APKO_IMAGE in
      .chainguard/ci/mega-module.yaml on the same apko release, so the
      mega-module reproducibility check compares the provider's apko library
      with the matching apko CLI. Resolve the current digest of
      ghcr.io/wolfi-dev/apko:latest with crane digest, and read its apko
      version from the image's usr/lib/apk/db/installed (the V: line of the
      P:apko record, without the -rN suffix). The image has no version tags.
      If that version is newer than the chainguard.dev/apko require in
      go.mod, update the module to it with go get and go mod tidy, fix what
      the update breaks, and verify with go build ./..., go test ./... and
      go generate ./... leaving the tree clean. Never move
      chainguard.dev/apko to a version other than the image's, and never
      downgrade it: if the image's version is older than go.mod's, change
      nothing. Otherwise set APKO_IMAGE to
      ghcr.io/wolfi-dev/apko:latest@<digest>, even when the version is
      unchanged, so it picks up rebuilds. Update no other dependency;
      dependabot handles those.
